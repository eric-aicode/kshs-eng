  <main class="container">

      <h1 class="panel-title"><span>🔍</span> 輸入一堆單字，自動挑出大考對應題目</h1>
      <p class="panel-desc">
        無論是課本單字、考卷生字或衝刺單字本，直接貼在下方輸入框中（可用逗號、空格或換行隔開）。<br>
        系統將跨庫比對 <strong>106~115 學測全 125 題真題（含選項）</strong> 及 <strong>1,500 組滿級分搭配詞</strong>，為您量身打造專屬測驗！
      </p>

      <textarea id="vocabInput" class="input-textarea" placeholder="在此貼上一堆英文單字...例如：properly, pursue, conscious, delicate, reserve, sustainable, balance, climate"></textarea>

      <div class="preset-tags">
        <span style="font-size:0.8rem; font-weight:800; color:#64748b;">⚡ 快速試玩：</span>
        <button class="preset-btn" onclick="setPreset('highfreq')">大考高頻核心動詞</button>
        <button class="preset-btn" onclick="setPreset('traps')">學測常考混淆陷阱字</button>
        <button class="preset-btn" onclick="setPreset('essay')">頂標寫作高分詞彙</button>
        <button class="preset-btn" onclick="clearInput()">清空</button>
      </div>

      <div class="action-row">
        <div style="font-size:0.85rem; color:#64748b;">
          💡 支援自動還原字根與詞形變化（如 pursuing ➔ pursue）
        </div>
        <button class="btn-search" onclick="executeSearch()">
          <span>⚡ 立即智慧挑題組卷</span>
        </button>
      </div>
    </div>

  <script>
    const VOCAB_DB = [{"id": "106-01", "year": 106, "question_no": 1, "stem": "John's clock is not functioning ______. The alarm rings even when it's not set to go off.", "options": {"A": "tenderly", "B": "properly", "C": "solidly", "D": "favorably"}, "answer": "B", "answer_word": "properly", "pos": "adv.", "levels": {"A": 3, "B": 2, "C": 3, "D": 4}, "clue": "與 not functioning 連用，修飾時鐘正常運轉", "gloss": {"A": "溫柔地", "B": "適當地、正常地", "C": "堅固地", "D": "贊同地、順利地"}, "trans": "約翰的時鐘運作不正常。即使沒有設定鬧鐘，它也會響起。"}, {"id": "106-02", "year": 106, "question_no": 2, "stem": "Michael has decided to ______ a career in physics and has set his mind on becoming a professor.", "options": {"A": "pursue", "B": "swear", "C": "reserve", "D": "draft"}, "answer": "A", "answer_word": "pursue", "pos": "v.", "levels": {"A": 4, "B": 3, "C": 3, "D": 4}, "clue": "與 career (職業生涯) 連用，追求事業用 pursue", "gloss": {"A": "追求、從事", "B": "發誓、咒罵", "C": "預約、保留", "D": "初稿、草案"}, "trans": "麥可決定從事物理學的職業生涯，並下定決心要成為一名教授。"}, {"id": "106-03", "year": 106, "question_no": 3, "stem": "Peter plans to hike in a ______ part of Africa, where he might not meet another human being for days.", "options": {"A": "native", "B": "tricky", "C": "remote", "D": "vacant"}, "answer": "C", "answer_word": "remote", "pos": "adj.", "levels": {"A": 3, "B": 3, "C": 3, "D": 3}, "clue": "空格前後與句意關鍵詞搭配，答案為 remote", "gloss": {"A": "本土的、天生的", "B": "棘手的、狡猾的", "C": "偏遠的、遙遠的", "D": "空缺的、空著的"}, "trans": "彼得計畫在非洲的一個偏遠地區徒步旅行，在那裡他可能好幾天都遇不到其他人。"}, {"id": "106-04", "year": 106, "question_no": 4, "stem": "People in this community tend to ______ with the group they belong to, and often put group interests before personal ones.", "options": {"A": "appoint", "B": "eliminate", "C": "occupy", "D": "identify"}, "answer": "D", "answer_word": "identify", "pos": "v.", "levels": {"A": 4, "B": 4, "C": 4, "D": 4}, "clue": "空格前後與句意關鍵詞搭配，答案為 identify", "gloss": {"A": "指派、任命", "B": "消除、淘汰", "C": "佔據、佔用", "D": "認同、辨認"}, "trans": "這個社區的人們往往會認同他們所屬的團體，且常常把團體利益置於個人利益之上。"}, {"id": "106-05"     const PRESETS = {
      highfreq: "pursue, properly, relieve, expand, reserve, exhaust, propose, suspend, illustrate, distinguish",
      traps: "conscious, conscientious, sensitive, sensible, considerable, considerate, delicate, dedicated, respectable, respectful",
      essay: "sustainable, biodiversity, ecological, innovate, cultivate, accelerate, dilemma, indispensable, cornerstone, perspective"
    };

    function setPreset(key) {
      document.getElementById('vocabInput').value = PRESETS[key] || '';
      executeSearch();
    }

    function clearInput() {
      document.getElementById('vocabInput').value = '';
      document.getElementById('resultsArea').style.display = 'none';
    }

    let currentMatchedItems = [];

    function executeSearch() {
      const raw = document.getElementById('vocabInput').value.trim();
      if (!raw) {
        alert('請先輸入或貼上至少一個英文單字！');
        return;
      }

      // Tokenize
      const tokens = raw.toLowerCase().match(/[a-z]+/g) || [];
      const uniqueWords = [...new Set(tokens)];

      if (uniqueWords.length === 0) {
        alert('未檢測到有效的英文單字！');
        return;
      }

      const matchedWords = new Set();
      const matchedItems = [];
      const wordHitsCount = {};

      uniqueWords.forEach(w => wordHitsCount[w] = 0);

      // 1. Search in VOCAB_DB (Real Exams)
      VOCAB_DB.forEach(q => {
        const ans = q.answer_word.toLowerCase();
        const opts = ['A', 'B', 'C', 'D'].map(l => q.options[l].toLowerCase());
        const stem = q.stem.toLowerCase();

        let hitWords = [];
        uniqueWords.forEach(w => {
          // Exact or prefix match
          if (w === ans || opts.includes(w) || (w.length >= 4 && (ans.startsWith(w) || w.startsWith(ans)))) {
            hitWords.push(w);
            matchedWords.add(w);
            wordHitsCount[w] = (wordHitsCount[w] || 0) + 1;
          } else if (new RegExp(`\\b${w}[a-z]*\\b`, 'i').test(stem)) {
            hitWords.push(w);
            matchedWords.add(w);
            wordHitsCount[w] = (wordHitsCount[w] || 0) + 1;
          }
        });

        if (hitWords.length > 0) {
          matchedItems.push({
            type: 'real',
            id: q.id,
            badge: `${q.year} 學測第 ${q.question_no} 題`,
            stem: q.stem,
            options: q.options,
            answer: q.answer,
            word: q.answer_word,
            pos: q.pos,
            hitWords: hitWords,
            gloss: q.gloss ? q.gloss[q.answer] : '',
            clue: q.clue || '',
            trap: q.writing ? q.writing.trap : ''
          });
        }
      });

      COLLOC_DB.forEach(c => {
        const core = c.core_word.toLowerCase();
        const phrase = c.phrase.toLowerCase();
        const sent = c.writing_sentence.toLowerCase();

        let hitWords = [];
        uniqueWords.forEach(w => {
          if (w === core || (w.length >= 4 && (core.startsWith(w) || w.startsWith(core)))) {
            hitWords.push(w);
            matchedWords.add(w);
            wordHitsCount[w] = (wordHitsCount[w] || 0) + 1;
          } else if (new RegExp(`\\b${w}[a-z]*\\b`, 'i').test(phrase) || new RegExp(`\\b${w}[a-z]*\\b`, 'i').test(sent)) {
            hitWords.push(w);

            id: c.id,
            badge: `${c.theme} [${c.pattern}]`,
            stem: c.writing_sentence.replace(new RegExp(`\\b${c.core_word}[a-z]*\\b`, 'i'), '______'),
            word: c.core_word,
            phrase: c.phrase,
            sentence: c.writing_sentence,
            chinese: c.chinese,
            trans: c.sentence_trans,
            tip: c.exam_tip,
            hitWords: hitWords
          });
        }
      });

      currentMatchedItems = matchedItems;

      // Render Results
      document.getElementById('resultsArea').style.display = 'block';
      document.getElementById('statsTitle').textContent = `✅ 成功匹配 ${matchedWords.size} / ${uniqueWords.length} 個單字，共挑選出 ${matchedItems.length} 道相關大考題目！`;
      document.getElementById('statsSub').textContent = `真題庫命中 ${matchedItems.filter(i=>i.type==='real').length} 題 ｜ 滿級分搭配詞命中 ${matchedItems.filter(i=>i.type==='colloc').length} 題`;

      // Render Word Chips
      const chipsEl = document.getElementById('chipsCloud');
      chipsEl.innerHTML = '';
      uniqueWords.forEach(w => {
        const count = wordHitsCount[w] || 0;
        const chip = document.createElement('div');
        chip.className = `chip ${count > 0 ? 'chip-match' : 'chip-unmatch'}`;
        chip.innerHTML = `${w} <span style="font-size:0.75rem; opacity:0.8;">(${count > 0 ? count + '題' : '未收錄'})</span>`;
        chipsEl.appendChild(chip);
      });

      // Render Items
      const listEl = document.getElementById('matchedListContainer');
      listEl.innerHTML = '';

      if (matchedItems.length === 0) {
        listEl.innerHTML = `
          <div class="card-panel" style="text-align:center; padding:40px;">
            <div style="font-size:2rem; margin-bottom:10px;">🔍</div>
            <div style="font-size:1.1rem; font-weight:800; color:#0f172a;">未搜尋到與這批單字完全對應的大考題目</div>
            <div style="font-size:0.9rem; color:#64748b; margin-top:6px;">請確認英文拼字是否正確，或嘗試點選上方的「快速試玩」預設字單！</div>
          </div>
        `;
        return;
      }

      matchedItems.forEach((item, idx) => {
        const isReal = item.type === 'real';
        const card = document.createElement('div');
        card.className = 'item-card';

        let inner = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <div style="display:flex; align-items:center; gap:8px;">
              <span class="${isReal ? 'item-badge-real' : 'item-badge-colloc'}">${isReal ? '歷屆真題' : '搭配詞大典'}</span>
              <span style="font-size:0.85rem; font-weight:800; color:#334155;">第 ${idx+1} 題 · ${item.badge}</span>
            </div>
            <div style="font-size:0.8rem; color:#6366f1; font-weight:700;">
              命中：${item.hitWords.join(', ')}
            </div>
          </div>
          <div style="font-size:1.15rem; font-weight:700; color:#0f172a; margin-bottom:12px; line-height:1.6;">
            ${item.stem}
          </div>
        `;

        if (isReal) {
          inner += `
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px;">
              ${['A','B','C','D'].map(l => `
                <div style="padding:6px 12px; border-radius:6px; border:1px solid #e2e8f0; font-size:0.9rem; background:${l===item.answer?'#f0fdf4':'white'}">
                  ${l}. ${item.options[l]} ${l===item.answer ? '✅' : ''}
                </div>
              `).join('')}
            </div>
            <div style="font-size:0.85rem; color:#475569; background:#f8fafc; padding:10px; border-radius:8px;">
              <strong>正解：</strong>(${item.answer}) ${item.word} [${item.pos}] - 中譯：${item.gloss}<br>
              <strong>陷阱：</strong>${item.trap}
            </div>
          `;
        } else {
          inner += `
            <div style="font-size:0.95rem; font-weight:800; color:#0284c7; margin-bottom:6px;">
              💎 黃金搭配詞：${item.phrase} （${item.chinese}）
            </div>
            <div style="font-size:0.85rem; color:#475569; background:#f8fafc; padding:10px; border-radius:8px;">
              <strong>完整範句：</strong>"${item.sentence}"<br>
              <strong>範句翻譯：</strong>${item.trans}<br>
              <strong>考點提示：</strong>${item.tip}
            </div>
          `;
        }

        card.innerHTML = inner;
        listEl.appendChild(card);
      });
    }

    function printCustomSheet(mode) {
      if (currentMatchedItems.length === 0) return;
      const pArea = document.getElementById('printArea');
      let html = `<div class="print-title">學測英文智慧挑題自選測驗卷 (共 ${currentMatchedItems.length} 題)</div>`;
      html += `<div style="text-align:right; font-size:0.85rem; margin-bottom:12px;">姓名：_____________ 計分：_____ / 100</div>`;
      html += `<div class="print-grid">`;

      currentMatchedItems.forEach((item, idx) => {
        if (mode === 'study') {
          html += `
            <div class="print-card">
              <div style="font-weight:bold; margin-bottom:4px;">${idx+1}. [${item.badge}] ${item.stem}</div>
              <div style="color:#059669; font-weight:bold;">★ 核心關鍵詞：${item.word}</div>
              <div style="font-size:0.85rem; color:#444;">${item.type==='real' ? '中譯：' + item.gloss : '搭配：' + item.phrase + ' (' + item.chinese + ')'}</div>
              <div style="font-size:0.8rem; color:#666; margin-top:2px;">${item.type==='real' ? '解析：' + item.clue : '翻譯：' + item.trans}</div>
            </div>
          `;
        } else {
          html += `
            <div class="print-card">
              <div style="font-weight:bold; margin-bottom:6px;">${idx+1}. ${item.stem}</div>
              ${item.type === 'real' ? `
                <div style="font-size:0.95rem; margin-left:8px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-top:6px;">
                  <span>(A) ${item.options.A}</span>
                  <span>(B) ${item.options.B}</span>
                  <span>(C) ${item.options.C}</span>
                  <span>(D) ${item.options.D}</span>
                </div>
              ` : `
                <div style="font-size:0.85rem; color:#666; font-style:italic;">[請寫出填空處核心單字與搭配片語]</div>
              `}
            </div>
          `;
        }
      });

      html += `</div>`;
      pArea.innerHTML = html;
      setTimeout(() => window.print(), 100);
    }
  </script>
</body>
</html>
